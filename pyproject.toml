[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-analytics-lab"
version = "0.1.0"
description = "Fintech analytics portfolio: payments, forecasting and experimentation on synthetic data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "plotly>=5.22",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# P3 keeps dense `# fmt: skip` dict literals for readability; long lines are intentional there.
"src/fintech_lab/p3_experiments/*.py" = ["E501"]
# P2 report templates keep long prose/f-string lines for readability.
"src/fintech_lab/p2_forecasting/closing.py" = ["E501"]
"projects/03-experimentation-lab/app/*.py" = ["E501"]
