# P2.4 business scenarios: ASSUMPTIONS, not statistical intervals. Values are round illustrative
# choices made AFTER the P2.3 holdout results had been seen (git: f0e985c precedes this file); they
# are NOT calibrated to cover the realized outcome.
version: s1
horizon: {start: "2025-10-01", end: "2025-12-31"}   # T4, 92 days
ratios_window_days: 90          # driver ratios (take rate, cost/TPV, refund+chargeback/fee) from the last N days <= as_of
# Relative changes applied to the base driver (+0.05 = +5%). TPV = merchants x volume/merchant x ticket.
scenarios:
  conservative:
    merchants: -0.03            # active merchants
    volume_per_merchant: -0.05  # successful payments per active merchant
    ticket: -0.02               # average ticket (BRL)
    take_rate: -0.03
    refund_cb: 0.30             # refund + chargeback share of fee
    proc_cost: 0.10             # processing cost per TPV
    var_cost: 0.10              # other variable cost per TPV
  base:
    merchants: 0.0
    volume_per_merchant: 0.0
    ticket: 0.0
    take_rate: 0.0
    refund_cb: 0.0
    proc_cost: 0.0
    var_cost: 0.0
  optimistic:
    merchants: 0.03
    volume_per_merchant: 0.05
    ticket: 0.02
    take_rate: 0.03
    refund_cb: -0.15
    proc_cost: -0.05
    var_cost: -0.05
sensitivity:
  step: 0.10                    # one-at-a-time +/- 10% on each driver
