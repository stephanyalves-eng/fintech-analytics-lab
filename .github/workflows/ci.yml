name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Pinned environment that produced the committed outputs (audit M3/M4).
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
      # P1 smoke: default dataset must pass every contract + reconciliation check, and the
      # content hash is printed so it can be compared with the manifest committed locally.
      - run: python -m fintech_lab.p1_payments.cli generate
      - run: python -m fintech_lab.p1_payments.cli check
      - run: python -m fintech_lab.p1_payments.cli build
      # P2 smoke: whole pipeline on the P1 dataset just generated, verifying the committed frozen
      # budgets and champions (fails if the data they were frozen on changed), then the independent audit.
      - run: python -m fintech_lab.p2_forecasting.cli pipeline --workers 2
      - run: python -m fintech_lab.p2_forecasting.cli audit
      # P3 smoke: locked protocol, generated scenarios, locked analysis.
      - run: python -m fintech_lab.p3_experiments.cli verify
      - run: python -m fintech_lab.p3_experiments.cli generate
      - run: python -m fintech_lab.p3_experiments.cli analyze
      # Known-vulnerability scan of the pinned dependencies (names and versions only leave the runner).
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off
      # Browser QA on the three running dashboards (Chrome is preinstalled on ubuntu-latest).
      - name: Start dashboards
        run: |
          nohup python -m fintech_lab.p1_payments.cli dashboard --port 8501 > p1.log 2>&1 &
          nohup python -m fintech_lab.p3_experiments.cli dashboard --port 8502 > p3.log 2>&1 &
          nohup python -m fintech_lab.p2_forecasting.cli dashboard --port 8503 > p2.log 2>&1 &
          for p in 8501 8502 8503; do
            for i in $(seq 1 120); do curl -sf http://localhost:$p/_stcore/health && break; sleep 1; done
            curl -sf http://localhost:$p/_stcore/health
          done
      - run: python -m fintech_lab.shared.keyboard_smoke --url http://localhost:8501 --out /tmp/kb_p1.md --name p1 --port 9338 --strict
      - run: python -m fintech_lab.shared.keyboard_smoke --url http://localhost:8502 --out /tmp/kb_p3.md --name p3 --port 9339 --strict
      - run: python -m fintech_lab.shared.keyboard_smoke --url http://localhost:8503 --out /tmp/kb_p2.md --name p2 --port 9340 --strict
      - run: python projects/03-experimentation-lab/app/a11y_audit.py --url http://localhost:8502 --strict
      - run: python projects/02-tpv-revenue-forecasting/app/a11y_audit.py --url http://localhost:8503 --strict
      - if: failure()
        run: tail -n 40 p1.log p2.log p3.log
