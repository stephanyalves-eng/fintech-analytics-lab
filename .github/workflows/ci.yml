name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # Pinned environment that produced the committed outputs (audit M3/M4).
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q
      # P1 smoke: default dataset must pass every contract + reconciliation check, and the
      # content hash is printed so it can be compared with the manifest committed locally.
      - run: python -m fintech_lab.p1_payments.cli generate
      - run: python -m fintech_lab.p1_payments.cli check
      - run: python -m fintech_lab.p1_payments.cli build
      # P2 smoke: whole pipeline on the P1 dataset just generated, verifying the committed frozen
      # budgets and champions (fails if the data they were frozen on changed), then the independent audit.
      - run: python -m fintech_lab.p2_forecasting.cli pipeline --workers 2
      - run: python -m fintech_lab.p2_forecasting.cli audit
      # P3 smoke: locked protocol, generated scenarios, locked analysis.
      - run: python -m fintech_lab.p3_experiments.cli verify
      - run: python -m fintech_lab.p3_experiments.cli generate
      - run: python -m fintech_lab.p3_experiments.cli analyze
